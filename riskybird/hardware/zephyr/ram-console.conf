# Console into a RAM ring buffer instead of the UART.
#
# For a board whose UART is unproven or unwired. The buffer is a plain array,
# ram_console_buf, that a debugger reads over the same JTAG link that loaded the
# image, so a workload can report results with no serial path at all:
#
#   rb build <workload> --target <t> --ram-console
#   (gdb) printf "%s", ram_console_buf
#
# Applied last, so CONFIG_UART_CONSOLE=n overrides hardware/zephyr/fpga.conf.
# Never a default: the UART console is what these shells are supposed to use,
# and silently substituting RAM would hide a regression in it.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=n
