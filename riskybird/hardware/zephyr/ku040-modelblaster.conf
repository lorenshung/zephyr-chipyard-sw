# Overrides for running modelblaster / xpurt harness binaries on a KU040 shell.
#
# Layer this AFTER fpga.conf -- later files win in Zephyr's conf merge:
#   -DEXTRA_CONF_FILE="hardware/zephyr/fpga.conf;hardware/zephyr/ku040-modelblaster.conf"
#
# fpga.conf is tuned for the 32 KiB scratchpad shells, where every kilobyte
# matters. Those choices are wrong for generated ML kernels:
#
#   MINIMAL_LIBC has no libm, so a kernel calling expf() (ELU/softmax) fails to
#   compile with "implicit declaration of function 'expf'". Picolibc provides it.
#
#   CBPRINTF_NANO has no floating-point conversion and no length modifiers, so
#   model outputs and MODELBLASTER_* trace rows print as garbage.
#
# Both are affordable here because these shells are DDR-backed: the harness
# alone asks for a 4 MB main stack (modelblaster/harness/prj.conf).
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y

# CBPRINTF_NANO is a Kconfig *choice* member, so "CONFIG_CBPRINTF_NANO=n" is
# silently ineffective -- fpga.conf's =y stays selected and FP_SUPPORT never
# takes. Select the sibling instead. Symptom of getting this wrong: floats
# print as the literal string "*float*", which is cbprintf's placeholder.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# The harness calls sys_reboot() to end a Spike/FireSim run; fpga.conf disables
# REBOOT to save space. On hardware there is no SoC reboot implementation, so
# Zephyr prints "Failed to reboot: spinning endlessly..." and idles -- which is
# the desired end state anyway, and lets the link succeed.
CONFIG_REBOOT=y

# Picolibc's printf drops floating-point conversion unless asked, so %g in the
# harness's VERIFY and OUTPUT blocks prints literally as "%g" and every model
# output is lost. CBPRINTF_FP_SUPPORT above only covers Zephyr's own cbprintf,
# not picolibc's.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_PICOLIBC_IO_LONG_LONG=y
