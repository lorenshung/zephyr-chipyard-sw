# Companion to fpga-esp-uart.overlay. The two MUST travel together.
#
# The overlay adds uart@10021000 and marks it status = "okay", which is enough
# for DT_NODE_EXISTS and DT_NODE_HAS_STATUS(..., okay) to be true -- but NOT
# enough for a device to exist. drivers/serial/uart_sifive.c instantiates per
# port behind its own Kconfig, and fpga.conf enables only PORT_0. So without
# this line the node is present and okay, the alias resolves, every
# `#if HAVE_ESP_UART` block compiles in, and DEVICE_DT_GET emits a reference to
# a __device_dts_ord_N symbol that nothing ever defines.
#
# That is not hypothetical. Enabling the uplink command reader was the first
# thing to reference the device from a build that had the overlay but no
# mode-specific conf, and `--mode default` failed to link with
#
#     undefined reference to `__device_dts_ord_36'
#
# pointing at main.cpp's telemetry mirror -- code that had been there all along
# and was only ever saved by --gc-sections discarding it unreferenced.
#
# It was previously set in exactly two mode confs
# (flight_controller-esp-motors.conf, flight_controller-telem.conf), so the DT
# node and the driver that backs it could silently decouple in any other mode.
# rb now appends this file wherever it appends the overlay, which is the only
# arrangement in which they cannot drift apart.
CONFIG_UART_SIFIVE_PORT_1=y
