# FireSim target: Chipyard SoC simulated on the Alveo U250 via FireSim.
#
# Board is the same chipyard_riscv64/rocketchip_virt_riscv64 that the
# arty100t and ku040 targets use, so no devicetree overlay is needed: the
# base DTS already places ram0 at 0x80000000 (256 MiB, backed by FireSim's
# FASED DDR model) and selects the HTIF console, which is what the FireSim
# TSI bridge presents. This is the same arrangement
# backends/modelblaster/harness/backends/firesim_chipyard.conf
# uses, differing only in hart count.
#
# Hart count must match the bitstream. The rb_u250_rocket bitstream
# (FireSimRiskyBirdRocketConfig -> chipyard.RocketConfig) is a SINGLE hart,
# so SMP is off. Raise MP_MAX_NUM_CPUS and set CONFIG_SMP=y when running a
# multi-hart bitstream.
CONFIG_MP_MAX_NUM_CPUS=1

# FireSim's DDR model gives us room the KU040 32 KiB scratchpad does not.
CONFIG_MAIN_STACK_SIZE=524288

# HTIF UART bulk-syscall printing: line-buffer printk and emit each buffer
# with one SYS_write tohost handshake instead of N per-char roundtrips.
# The per-char handshake costs ~10K target cycles, which dominates run time
# on an FPGA simulation otherwise.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
