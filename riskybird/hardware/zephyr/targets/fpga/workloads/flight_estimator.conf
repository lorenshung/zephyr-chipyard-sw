# Flight controller on the RiskyBird FPGA carrier.
#
# Overrides the parts of hardware/zephyr/fpga.conf that exist to keep an image
# inside a 32 KiB scratchpad. This workload only ever runs on a DDR-backed shell
# (512 KiB floor in tools/rb/boards.py), so those economies buy nothing here and
# two of them break the build outright.

# The estimator, the Mahony attitude filter and the PID cascade are float-heavy
# C++: fabsf, cosf, sqrtf, plus rand/RAND_MAX from TinyMPC's matlib. Zephyr's
# minimal libc declares none of them, so the build fails at the first
# attitude_mahony.hpp include with "'fabsf' was not declared in this scope".
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y

# Every diagnostic the flight stack prints is a float -- attitude, velocity,
# duty. CBPRINTF_NANO drops %f entirely, so the telemetry would read as literal
# "%f" and the bring-up would be unreadable rather than wrong-looking.
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# The application is C++ (main.cpp, estimator, controller). Its own prj.conf
# sets these, but state them here too so a change upstream cannot silently
# disable C++ on this target.
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n

# Sensor API for the BMI088 (and the baro/ToF as they are added).
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y

# SPI + GPIO for the PMW3901 optical flow (mode `flow`). Safe to enable in every
# mode: neither driver touches a motor pin, and the flow code itself is selected
# by the ROSE_FLOW knob plus the flow-spi alias, not by these.
CONFIG_SPI=y
CONFIG_GPIO=y

# NOTE: CONFIG_PWM is deliberately NOT here. pwm_sifive_init() writes pwmcfg,
# which changes what the motor pins are driven to -- so enabling it would give
# the earlier phases a way to disturb the motor outputs. It is turned on by
# flight_controller-motors.conf, which `--mode motors` picks up automatically;
# that mode selection is the opt-in. RB_CMAKE_ARGS="-DCONFIG_PWM=y" is no longer
# needed and should not be used to work around a mode that will not link.

# A thread stack overflow here prints instead of silently corrupting the
# estimator state, which is the difference between a diagnosable failure and a
# drone that behaves oddly.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# Down-facing VL53L1X. Needs hal_st, which setup.md step 2 pulls into the west
# workspace (`west update hal_espressif hal_st`); without it this symbol has no
# driver behind it and the node above binds to nothing.
CONFIG_VL53L1X=y

# Polling, not interrupt mode. CONFIG_VL53L1X_INTERRUPT_MODE is `default y` in
# the driver's Kconfig and depends only on GPIO, so it switches itself on here
# -- but riskybird does not wire the sensor's INT/GPIO1 data-ready pin, and the
# node above declares no int-gpios. The driver then calls
# gpio_pin_interrupt_configure_dt() on a spec whose .port is NULL, and every
# sample_fetch takes a load access fault at 0x10 (struct device's api offset):
#
#   mcause: 5, Load access fault / mtval: 10
#   vl53l1x_sample_fetch (vl53l1.c:382) -> z_impl_gpio_pin_interrupt_configure
#
# In polling mode channel_get uses VL53L1_WaitMeasurementDataReady, which polls
# over I2C and sleeps between polls (vl53l1_platform.c:131 WaitMs -> k_sleep),
# so it yields the CPU rather than spinning.
CONFIG_VL53L1X_INTERRUPT_MODE=n

# ---- Let the helper threads actually run ------------------------------------
#
# The app's priorities (PRIO_CTRL 3, PRIO_EST 5, PRIO_IO 7, down-ToF 8,
# PRIO_LED 10) were chosen for the THREADED RoSE path, where each control stage
# blocks on its own trigger and the helpers run in the gaps. On real hardware
# the app runs single-loop: the control loop is main() at
# CONFIG_MAIN_THREAD_PRIORITY, and it never blocks --
#
#   * no k_sleep/k_yield anywhere in the loop body,
#   * CONFIG_TIMESLICING is off, so a preemptible peer never rotates in,
#   * CONFIG_UART_INTERRUPT_DRIVEN is off, so even printk busy-waits.
#
# At the default priority 0 that starves every helper below it. Measured: over
# 5000 iterations the down-ToF thread did not execute once -- tofv stayed 0, no
# fetch ever returned, and its first instruction ran only after "control loop
# done". Altitude therefore dead-reckoned off accel (0.899 -> -10.802 m).
#
# 11 puts main below the down-ToF (8) and the status LED (10) so both preempt
# it. Neither can hog the core in exchange: the ToF's wait sleeps between I2C
# polls (vl53l1_platform.c:131) and the LED thread sleeps LED_TICK_MS, so each
# takes a few short slices and hands the core straight back. This costs the
# control loop only the helpers' real CPU time, which is why it is preferred
# over pacing the loop with k_msleep(1) -- at 1000 ticks/s that would have added
# a full millisecond to every iteration of a loop that currently runs at 1-5 ms.
CONFIG_MAIN_THREAD_PRIORITY=11
