# Extends flight_controller.conf; it is not a replacement for it.
#
# The SiFive serial driver does not instantiate from devicetree alone. It
# creates one device per CONFIG_UART_SIFIVE_PORT_n, bound to DT instance n of
# compatible "sifive,uart0". uart@10021000 is instance 1 by address order, so
# without this symbol the node still appears in the DTS but any DEVICE_DT_GET
# reference fails at link time with an undefined __device_dts_ord_* symbol.
CONFIG_UART_SIFIVE_PORT_1=y

# PID + EKF puts _kernel outside the +/-2 KiB GP-relaxation window. Keep the
# correct long-form address sequences; this mode can afford the small size cost.
CONFIG_LINKER_USE_RELAX=n
