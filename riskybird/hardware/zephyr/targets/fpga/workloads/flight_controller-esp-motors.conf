# Extends flight_controller.conf; it is not a replacement for it.
#
# The SiFive serial driver does not instantiate from devicetree alone: it creates
# one device per CONFIG_UART_SIFIVE_PORT_n, bound to DT instance n of compatible
# "sifive,uart0". uart@10021000 is instance 1 by address order, so without this
# symbol the node still appears in the DTS and DEVICE_DT_GET(DT_ALIAS(esp_uart))
# fails at link time with an undefined __device_dts_ord_*.
CONFIG_UART_SIFIVE_PORT_1=y

# NOTE the absence of CONFIG_PWM, and that it is not an oversight. This mode's
# whole purpose is that the FPGA drives no motor pin; pwm_sifive_init() writes
# pwmcfg, which changes what those pins are driven to, so the driver must not be
# compiled in at all. The overlay declares no `motors` alias either, so the PWM
# actuator code does not exist in this image and there is nothing to disable at
# run time.
