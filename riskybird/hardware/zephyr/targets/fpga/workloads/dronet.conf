# DroNet through the ModelBlaster harness, on a RiskyBird FPGA shell.
#
# The application is backends/modelblaster/harness (built in place, like
# flight_controller) plus the C that ModelBlaster's codegen emitted for this
# model and quantization. Its own prj.conf is written for spike; this file is
# what makes the same harness boot on the board.
#
# Layered after hardware/zephyr/fpga.conf and after the generated clock
# fragment, so it may override both.

# --- libc -------------------------------------------------------------------
# fpga.conf's MINIMAL_LIBC has no libm. Generated kernels call expf (ELU,
# softmax), sqrtf and fabsf; the first one fails the build with
# "implicit declaration of function 'expf'". Same reason flight_controller.conf
# makes this swap.
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y

# --- printing floats --------------------------------------------------------
# Everything this workload exists to report is printed: the VERIFY line's
# max_abs_err/max_rel_err, the OUTPUT block, and the per-op PROFILE rows that
# `rb modelblaster report` parses. CBPRINTF_NANO has no floating-point
# conversion, so those come out as the literal string "*float*" and the run
# yields nothing.
#
# CBPRINTF_NANO is a Kconfig *choice* member, so setting it to =n is silently
# ineffective -- fpga.conf's =y stays selected and FP_SUPPORT never takes.
# Select the sibling instead. (It cost a run to find.)
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# CBPRINTF_FP_SUPPORT covers Zephyr's own cbprintf, not picolibc's. Without
# these, picolibc's printf drops %g and the harness prints "%g" literally.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_PICOLIBC_IO_LONG_LONG=y

# --- memory -----------------------------------------------------------------
# The harness asks for a 4 MB main stack (backends/modelblaster/harness/prj.conf) and
# DroNet's weights and activations are far past a 32 KiB scratchpad, so this
# workload is DDR-only. tools/rb/boards.py enforces that with a RAM floor
# rather than leaving it to be discovered as a link failure.
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_HEAP_MEM_POOL_SIZE=65536

# --- ending the run ---------------------------------------------------------
# The harness calls sys_reboot() to finish; fpga.conf disables REBOOT to save
# space. There is no SoC reboot implementation on these shells, so Zephyr prints
# "Failed to reboot: spinning endlessly..." and idles -- which is the desired
# end state for a capture, and lets the link succeed.
CONFIG_REBOOT=y

# --- timing -----------------------------------------------------------------
# model_wall_cycles() is a k_cycle_get_64 delta, and it is the number the FPS
# estimate comes from. TIMING_FUNCTIONS is already on in fpga.conf; state the
# dependency here so a change there cannot silently invalidate every recorded
# frame time.
CONFIG_TIMING_FUNCTIONS=y
