# Extends flight_controller.conf; it is not a replacement for it.
#
# This is the one mode that is allowed to drive the motor outputs, so it is the
# one place CONFIG_PWM is turned on. pwm_sifive_init() writes pwmcfg, which
# changes what the motor pins are driven to -- keeping it out of the base config
# is what stops the `default` and `flow` modes from being able to disturb them.
#
# Selecting `--mode motors` IS the opt-in. It previously also required
# RB_CMAKE_ARGS="-DCONFIG_PWM=y" on top, and without it the build failed at link
# time with an undefined reference to __device_dts_ord_26 -- the pwm0 node --
# because the overlay declared the motors while no PWM driver was compiled.
CONFIG_PWM=y
