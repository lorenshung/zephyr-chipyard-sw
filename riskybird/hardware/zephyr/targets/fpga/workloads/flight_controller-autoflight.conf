# Extends flight_controller.conf; it is not a replacement for it.
#
# Phase 5: autonomous short-hop flight. This mode can drive the motors, so it
# turns CONFIG_PWM on for the same reason flight_controller-motors.conf does --
# pwm_sifive_init() writes pwmcfg, which changes what the motor pins are driven
# to, and keeping it out of the base config is what stops `default` and `flow`
# from being able to disturb them.
CONFIG_PWM=y

# The flight profile is a background-logged run, not a printk run. The log is
# written by a low-priority thread into RAM and flushed at flight end, so it
# costs the control loop nothing; the console cannot make that promise. See the
# ROSE_TELEM_DIV note in main.cpp: this carrier's console is a 115200 FTDI link
# in polling mode (CONFIG_UART_INTERRUPT_DRIVEN is not set), so printk
# BUSY-WAITS -- it does not merely queue. At the stock divisor of 10 that is
# ~100 lines/s of ~150 chars against a link that can carry ~96, and the control
# loop inherits the backlog as its own dt.
#
# The mode's ROSE_TELEM_DIV=200 (tools/rb/boards.py) drops that to ~5 Hz, which
# a tether can drain. For UNTETHERED flight set ROSE_TELEM=0 as well --
# main.cpp measured 30-60 ms stalls, ~22% of a flight, with nothing draining
# the console.

# Stack for the flight-log thread on top of what the base config allocates.
# Sized with a sentinel rather than by guesswork: a log thread that overflows
# during a flight corrupts the estimator state next to it, which is the one
# failure that looks like a control bug and is not.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
