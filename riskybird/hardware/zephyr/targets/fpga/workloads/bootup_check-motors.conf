# Extends bootup_check.conf semantics from prj.conf; it does not replace it.
#
# The only mode allowed to drive the motor outputs, so the only place CONFIG_PWM
# is turned on. pwm_sifive_init() writes pwmcfg, which changes what the motor
# pins are driven to -- keeping it out of the default build is what makes the
# sensor-only pass actuation-free.
CONFIG_PWM=y
