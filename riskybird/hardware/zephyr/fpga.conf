# Common configuration for the one-hart RiskyBird FPGA shells.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_UART_HTIF=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y

# The backend board describes a QEMU-sized 1024-source PLIC. RiskyBird's common
# shell uses sources 1..3, while the elaborated DroneLogic shell uses 1..15.
# PLIC source IDs run from 1 through 15; four encoding bits cover those IDs.
CONFIG_2ND_LEVEL_INTERRUPT_BITS=4
CONFIG_MAX_IRQ_PER_AGGREGATOR=15
# NUM_IRQS has no prompt and therefore cannot be assigned here. Each RiskyBird
# application with a custom Kconfig sources hardware/zephyr/Kconfig.fpga before
# Kconfig.zephyr; tools/rb supplies Kconfig.workload for applications without
# their own Kconfig root.

# Chipyard's CLINT timebase is 50 kHz on the 50 MHz FPGA shells.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=50000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_TIMING_FUNCTIONS=y
CONFIG_FPU=y
CONFIG_FLOAT_HARD=y

# Keep the common image small enough for FPGA scratchpads. Workloads opt into
# larger stacks where their measured call depth needs it.
CONFIG_MINIMAL_LIBC=y
CONFIG_ISR_STACK_SIZE=1024
CONFIG_BOOT_BANNER=n
CONFIG_REBOOT=n
CONFIG_TIMESLICING=n
CONFIG_CBPRINTF_NANO=y
