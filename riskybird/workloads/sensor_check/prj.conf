# Sized and timed by the FPGA fragments; see hardware/zephyr/fpga.conf.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
# The BMI088 is read through Zephyr's bosch,bmi08x driver, which is the path
# docs/drone-initial-bringup.md already proves on this hardware (real gravity,
# |a| within 1.3% of 9.80665 across three samples). One symbol covers both
# halves; BMI08X_ACCEL/BMI08X_GYRO are not Kconfig symbols in this tree. Matches
# workloads/state/conf/bmi088.conf, so this target exercises exactly what
# `state --mode bmi088` will use.
CONFIG_SENSOR=y
CONFIG_BMI08X=y
# 2048 (copied from workloads/state) is not enough here: state prints one line
# per decimation interval, while this target formats a line per sensor plus a
# per-address inventory, and cbprintf's frames are not small. At 2048 the run
# faulted partway through the inventory and reset to __start, which looks like a
# hang on the console rather than an overflow.
CONFIG_MAIN_STACK_SIZE=8192


# No float formatting, deliberately. CBPRINTF_FP_SUPPORT needs the complete
# formatter, and the rest of this tree prints scaled integers instead --
# workloads/state sets CBPRINTF_FP_SUPPORT=n and reports milli-units. Every
# reading below is printed the same way, so a magnitude check reads as
# 9807 mm/s^2 rather than pulling in a second printf implementation.
CONFIG_CBPRINTF_FP_SUPPORT=n
