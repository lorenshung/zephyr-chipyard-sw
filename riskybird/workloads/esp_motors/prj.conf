# ESP32-C6 driving all four motor gates from FPGA duty frames.

# LEDC PWM on GPIO21/20/23/22.
CONFIG_PWM=y

# The FPGA link. Interrupt-driven, not polled: polling a 115200 link from the
# motor thread would either burn the core or drop bytes, and the motor thread
# has a failsafe to run. The ISR only moves bytes into a ring.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=2048

# A stack overflow in the motor thread must say so rather than quietly corrupt
# the state the failsafe reads.
CONFIG_STACK_SENTINEL=y
