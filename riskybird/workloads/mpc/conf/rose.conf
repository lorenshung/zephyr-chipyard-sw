CONFIG_RB_MPC_INPUT_REPLAY=n
CONFIG_RB_MPC_INPUT_ROSE=y
# The generic RoSE driver allocates kernel semaphores for its optional DMA
# channel even though this MPC flow uses polling request/response only.
CONFIG_MULTITHREADING=y
CONFIG_ROSE=y
CONFIG_ROSE_PROTOCOL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
