# ESP32-C6 WiFi bridge between the FPGA flight controller and a laptop.
#
# The networking settings below are not guesses: they are the configuration
# docs/TELEMETRY_BRINGUP.md in the Zephyr fork records as RELIABLE end-to-end
# (49.8 Hz, 0.3% loss, 0 gaps > 100 ms over a 3-minute soak). Three of them
# were the difference between "the SSID appears but I cannot connect" and a
# working link, so they are called out individually rather than tidied away.

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_RING_BUFFER=y

# ---- WiFi ------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
# Deterministic SINGLE-interface SoftAP. With AP_STA mode enabled the esp32
# driver registers two net_ifs and the first one is not necessarily the AP, so
# net_if_get_wifi_sap() and the DHCP server can end up on different interfaces.
CONFIG_ESP32_WIFI_AP_STA_MODE=n
CONFIG_NET_IF_MAX_IPV4_COUNT=1

# ---- Networking ------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=n

# The event handler reads the client MAC out of cb->info. Without this the info
# pointer is NULL, the handler faulted, and the symptom was "the SSID is
# visible but nothing can associate" -- which reads as a radio problem and is
# not one. The handler here NULL-guards it as well; both, not either.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# ---- Stacks ----------------------------------------------------------------
# The DHCP-time crash fix. The default 1024-byte system workqueue stack
# overflowed exactly when a client took a lease, so the link died at the moment
# it started working. Raised together with the net stacks rather than alone --
# they are on the same path and a fix to one just moves the overflow.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# ---- Diagnostics -----------------------------------------------------------
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_THREAD_NAME=y
# A bridge that silently stops forwarding is indistinguishable from a drone
# that stopped talking, so an overflow has to say so rather than be dropped.
CONFIG_STACK_SENTINEL=y

# The boot-time scheduler audit (sched_audit() in main.c) walks every thread and
# prints its priority. k_thread_foreach_unlocked() needs the kernel to keep the
# thread list, which is what this turns on. It is enabled for BOTH builds rather
# than only the motors one: in the plain bridge the list is merely interesting,
# but the whole point of the audit is that a Zephyr bump can silently change a
# networking thread's priority, and noticing that in the safe image -- before
# the same stack is flashed onto something that owns four motor gates -- is
# worth a few hundred bytes.
CONFIG_THREAD_MONITOR=y
