# esp_bridge --mode motors: the WiFi bridge AND all four motor gates, one image.
#
# Extends prj.conf; everything the bridge needs is already there. rb picks this
# up as <workload>/conf/<mode>.conf (tools/rb/boards.py Workload.mode_conf), and
# the matching devicetree is
# hardware/zephyr/targets/esp32c6/workloads/esp_bridge-motors.overlay.
#
# READ THE SCHEDULING SECTION OF src/main.c BEFORE TOUCHING ANY OF THIS. Every
# line below exists because a motor failsafe now shares a CPU with a WiFi stack.

# ---- the gates -------------------------------------------------------------
# LEDC PWM on GPIO21/20/23/22, exactly as workloads/esp_motors drives them.
CONFIG_PWM=y

# ===========================================================================
# THE PRIORITY WORK. THIS IS THE PART THAT MAKES MERGING SAFE OR NOT.
# ===========================================================================
#
# The motor link thread runs at K_PRIO_COOP(0) = -16. In Zephyr a COOPERATIVE
# THREAD IS NEVER PREEMPTED BY ANOTHER COOPERATIVE THREAD, whatever the
# priorities (kernel/include/kthread.h:227, should_preempt()). So every other
# cooperative thread in the system can hold the CPU against the failsafe until
# it happens to block. Priority numbers do not help; only preemptibility does.
#
# In the plain bridge build there are three such threads, read out of the
# generated .config and the Zephyr sources, NOT guessed:
#
#   net TC RX        K_PRIO_COOP(15) = -1   subsys/net/ip/net_tc.c:163,170
#   net_mgmt workq   K_PRIO_COOP(15) = -1   subsys/net/ip/net_mgmt.c:419
#   system workq     -1                     CONFIG_SYSTEM_WORKQUEUE_PRIORITY
#
# NOTE, because a prior analysis recorded otherwise and the difference matters:
# the net TC threads land at -1, NOT at -16. -16 is what you get if you enable
# CONFIG_NET_TC_THREAD_PRIO_CUSTOM and leave NET_TC_RX/TX_THREAD_BASE_PRIO at
# their default of 0 (subsys/net/ip/Kconfig:297-312) -- i.e. the "fix" of
# switching PRIO_CUSTOM on without also setting the base priorities CREATES the
# collision it was meant to prevent. Do not do that. There is also no TC TX
# thread at all here: CONFIG_NET_TC_TX_COUNT defaults to 0, and TX runs in the
# calling thread, which is the preemptible downlink thread.

# Makes the TC RX thread preemptible -- K_PRIO_PREEMPT(15 - i) instead of
# K_PRIO_COOP -- so the cooperative motor thread can genuinely take the CPU from
# it. It also demotes the net_mgmt work queue for free, because net_mgmt.c
# selects its priority with `#elif defined(CONFIG_NET_TC_THREAD_COOPERATIVE)`.
#
# Upstream marks this choice EXPERIMENTAL (subsys/net/ip/Kconfig `select`s
# EXPERIMENTAL from it -- which is why CONFIG_EXPERIMENTAL must NOT be written
# here: it has no prompt and Kconfig errors out on an explicit assignment). That
# is an honest label and it is still the right trade: an experimental scheduling
# class for the RADIO is a smaller risk than a non-preemptible radio thread
# sitting in front of a MOTOR FAILSAFE.
CONFIG_NET_TC_THREAD_PREEMPTIVE=y

# The last cooperative thread that is not the motor thread. The DHCP server runs
# its work here -- and the DHCP path is exactly the one that already produced a
# stack overflow on this workload once (see the stack sizes in prj.conf), so it
# is not a hypothetical burst. 1 rather than 0: still ahead of most application
# work, but preemptible.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=1

# NOT SET, deliberately: CONFIG_NUM_METAIRQ_PRIORITIES=1.
#
# That one line would turn priority -16 into a metairq priority
# (kernel/include/kthread.h:72), which is the ONLY construct in Zephyr that
# preempts a cooperative thread -- the motor thread would then be immune to all
# three threads above with no code change. It is the escape hatch if the boot
# audit ever reports a cooperative thread that cannot be demoted. It is off by
# default because Zephyr's own Kconfig says metairq "probably shouldn't be used
# from application code", and because an unproven scheduler change on a motor
# bench is its own hazard. Turn it on deliberately, with props off, and read the
# audit line again.

# ---- diagnostics -----------------------------------------------------------
# The link thread never prints, so a stack overflow there would otherwise be
# silent right up until it corrupted the state the failsafe reads.
CONFIG_STACK_SENTINEL=y

# File descriptors. The default of 4 is exactly consumed by the DHCP server,
# the socket-service eventfd, and the downlink and uplink sockets, so the status
# thread's socket failed with EMFILE and RBLINK never left the chip (measured
# 2026-09-23: telemetry reached the ground station, RBLINK did not).
CONFIG_ZVFS_OPEN_MAX=8
