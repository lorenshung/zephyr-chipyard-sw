# Fixed-duty motor commander: console in, duty frames out on uart1.
#
# NOTE THE ABSENCE OF CONFIG_PWM, and that it is not an oversight. The whole
# point of this image is that the FPGA drives no motor ball: pwm_sifive_init()
# writes pwmcfg, which changes what those pads are driven to, so the driver must
# not be compiled in at all. Same reasoning, and the same wording, as
# hardware/zephyr/targets/fpga/workloads/flight_controller-esp-motors.conf.

CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# The sifive serial driver does not instantiate from the devicetree alone: it
# defines one device per CONFIG_UART_SIFIVE_PORT_n, bound to DT instance n of
# compatible "sifive,uart0". uart@10021000 is instance 1 by address order, so
# without this the node exists in the DT and no device is ever created --
# DEVICE_DT_GET then fails at link time with an undefined __device_dts_ord_*.
CONFIG_UART_SIFIVE_PORT_1=y
