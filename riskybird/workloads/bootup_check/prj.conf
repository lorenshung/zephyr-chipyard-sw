# One pass over every peripheral a flight needs. Depth lives in the
# per-peripheral workloads; this one answers "is it alive", in boot order.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y

# BMI088 through the same bosch,bmi08x path state --mode bmi088 uses, so a pass
# here means the estimator's input is real.
CONFIG_SENSOR=y
CONFIG_BMI08X=y

# CONFIG_PWM is NOT here. pwm_sifive_init() writes pwmcfg, which changes what
# the motor pins are driven to, and this workload runs with propellers possibly
# on. The motors stage is compiled in only by --mode motors, whose conf adds it.

# Same reason as sensor_check: one line per stage plus a summary table, and
# cbprintf's frames are not small. 2048 faulted partway through that workload's
# inventory and reset to __start, which reads as a hang rather than an overflow.
CONFIG_MAIN_STACK_SIZE=8192

# Scaled integers everywhere, as in workloads/state and sensor_check, rather
# than pulling in the complete formatter for a handful of magnitudes.
CONFIG_CBPRINTF_FP_SUPPORT=n
