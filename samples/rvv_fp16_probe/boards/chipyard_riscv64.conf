# Board config for the Saturn fp16 vector-op probe on the At35 combined bitstream
# (RocketArty200TDroneGemminiSaturnFp16At35Config @ 35 MHz, misa.F=0).
# Minimal: console UART + soft-float + Saturn V. No FC sensor drivers/buses (the
# probe only needs to print and issue vector ops).

# ---- Console UART @ 35 MHz peripheral clock -> 115200 baud on ttyUSB5 ----
CONFIG_UART_HTIF=n
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=35000

# ---- No hardware fp32/fp64 on this bitstream -> soft float (probe has no scalar float) ----
CONFIG_FPU=n
CONFIG_FPU_SHARING=n

# ---- Saturn RISC-V Vector. The probe issues V ops directly from main.c (built
# per-file with a Zvfh -march); it is single-threaded so no V save/restore is
# exercised. Same V arch settings as the FC build for parity. ----
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
CONFIG_RISCV_VECTOR_MAX_LEN=512
