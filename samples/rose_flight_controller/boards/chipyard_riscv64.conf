# riskybird v3 flight controller on the FPGA Rocket (chipyard_riscv64), DroneFullDDR shell.
# Real sensor drivers bound by boards/chipyard_riscv64.overlay. Telemetry goes out over the ESP
# bridge (uart1), so no WiFi here; motors are inhibited for sensor/estimator bring-up.

# SiFive console UART @ 50 MHz peripheral clock -> 115200 baud on /dev/ttyUSB1.
CONFIG_UART_HTIF=n
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=50000

# Rocket (RV64GC) has a hardware FPU; the estimator + TinyMPC use float math.
CONFIG_FPU=y

# Buses + real sensor drivers
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_BMI08X=y
CONFIG_VL53L1X=y
CONFIG_VL53L1X_INTERRUPT_MODE=n
CONFIG_VL53L5CX=y
CONFIG_VL53L5CX_DEFAULT_RESOLUTION_8X8=y
CONFIG_BMP388=y

CONFIG_CBPRINTF_FP_SUPPORT=y
