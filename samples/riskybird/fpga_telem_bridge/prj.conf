# riskybird FPGA telemetry bridge — WiFi SoftAP + UART.
# WiFi/net block copied from rose_flight_controller/telem.conf (proven on esp32c6, incl. the
# net-mgmt-event / sys-workq stack sizes + NET_MGMT_EVENT_INFO fixes that stop the join crashes).

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
# Interrupt-driven RX (ISR -> ring buffer) so the FPGA-link UART never drops bytes mid-line during a
# sustained burst (camera snapshot chunks); the old poll+sleep relay corrupted lines under load.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- WiFi + IPv4/UDP networking (SoftAP + UDP bridge) ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_AP_STA_MODE=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# --- On-board HTTP server: serves the mobile flight page + a /t telemetry poll + /cmd uplink,
# --- so a phone on the SoftAP browses to http://192.168.4.1/ (no laptop/bridge needed). ---
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_FILE_SYSTEM=n
# fd table must hold: 2 UDP relay sockets + the server's eventfd + listen socket + up to MAX_CLIENTS
# accepted connections. The default 4 is too small -> the listen socket can't be created.
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=4
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_MAX_CONTEXTS=12
# net_conn table holds every UDP listener (uplink :14551, DHCP, mDNS) AND the TCP listener + each
# accepted HTTP connection. The default 4 is exhausted -> the TCP listener can't register and SYNs
# to :80 get RST'd ("connection refused").
CONFIG_NET_MAX_CONN=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HEAP_MEM_POOL_SIZE=98304
