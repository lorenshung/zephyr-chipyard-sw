# Shared (board-agnostic) config for the integrated FC + DroNet build.
# Sensor drivers, the soft-float / vector / clock settings, and the peripheral
# bindings are board-specific and live in boards/chipyard_riscv64.{conf,overlay}.

CONFIG_SENSOR=y
CONFIG_PRINTK=y

# C++ + a large main stack (the FC control loop runs in main(); the TinyMPC
# working set historically lived here -- kept generous even though this build
# uses the lighter PID controller).
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MAIN_STACK_SIZE=327680

CONFIG_BOOT_BANNER=n

# Catch a thread stack overflow (prints instead of silently corrupting) and name
# threads so the concurrent PID/DroNet/tof/camera threads are legible in traces.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# Preemptive scheduling (the high-priority PID loop in main, prio 0, preempts the
# low-priority DroNet thread, prio 13, on schedule) is on by default via the
# preemptible priority band -- CONFIG_PREEMPT_ENABLED is auto-derived, not set here.
