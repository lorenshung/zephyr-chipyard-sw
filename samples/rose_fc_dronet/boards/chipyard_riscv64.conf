# Integrated FC + DroNet on the riskybird v3 FPGA Rocket COMBINED core
# RocketArty200TDroneGemminiSaturnFp16At35Config @ 35 MHz.
#
# This core = the FullDDR-Dma-Uart drone periphery (BMI088/ToF/baro on i2c,
# PMW3901 flow on spi, motors on pwm, gpio, uart0 console + uart1 telem, OSPI
# camera + DMA) PLUS Gemmini + Saturn V128D64 + an FP16-only scalar FPU.
# Source of truth: fpga/.../arty200t/AccelConfigs.scala (:107-115, :225-228).
#
# misa = 0x8000000000b41105 = RV64 IMAC + V (+S/U/X); NO hardware fp32/fp64
# (the scalar FPU is fp16-only, WithRocketFPU16). So the whole app is built
# SOFT-FLOAT and the DroNet vector kernels are the only V code (kernels.c).

# ---- Console UART @ 35 MHz peripheral clock -> 115200 baud on /dev/ttyUSB1 ----
CONFIG_UART_HTIF=n
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=35000

# ---- No hardware fp32/fp64 on this bitstream -> soft float --------------------
# The FC (estimator/PID/Mahony) uses scalar fp32; on misa.F=0 that lowers to
# soft-float libcalls (functionally identical, just slower than the RV64GC
# FullDDR shell the FC was first brought up on). The int8 DroNet path uses no
# scalar float. CONFIG_FPU=n avoids the boot fscsr write that would trap on
# misa.F=0 (no need for CONFIG_RISCV_SKIP_BOOT_FCSR, which is the FPU=y path).
CONFIG_FPU=n
CONFIG_FPU_SHARING=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Saturn RISC-V Vector: EAGER context switch (preemption safety) ----------
# DroNet issues V instructions (Saturn RVV) only inside kernels.c. Enabling V at
# the arch level turns on vector register save/restore across context switches;
# LAZY=n makes it eager so a mid-vector kernel preempted by the PID loop has its
# full vector state (and vstart) preserved. V_KERNEL_ONLY keeps V codegen out of
# every non-kernel TU (FC/Zephyr/libc build with a no-V march) so scalar code
# can never be caught mid-vector. Matches modelblaster/harness/backends/
# gemmini_q31_rvv.conf, the proven DroNet-only config for this bitstream.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
# Save-area size per vreg = MAX_LEN/8. The At35 Saturn is WithRocketVectorUnit(128,64)
# => VLEN=128, so 256 was already safe (>=128, no eager-save overflow); set 512 to
# match the proven rose_fused_mpc/rvv_zfh.conf and leave zero doubt.
CONFIG_RISCV_VECTOR_MAX_LEN=512
# NOTE: rose_fused_mpc's rvv_zfh.conf also sets CONFIG_RISCV_ISA_EXT_ZFH/ZVFH=y.
# NOT enabled here: this integrated DroNet is INT8 (kernels built -march=rv64imac_zve64x,
# no vector-fp16), so Zfh/Zvfh are not needed for its correctness, and enabling scalar
# Zfh on this misa.F=0 core (WithRocketFPU16, Zfh-without-F) would pull in the FPU boot
# path (fscsr) that needs CONFIG_RISCV_SKIP_BOOT_FCSR. Add all three together only if a
# future fp16-vector DroNet variant needs them.

# ---- Buses + real sensor drivers (bound by boards/chipyard_riscv64.overlay) --
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_BMI08X=y
CONFIG_VL53L1X=y
CONFIG_VL53L1X_INTERRUPT_MODE=n
CONFIG_VL53L5CX=y
CONFIG_VL53L5CX_DEFAULT_RESOLUTION_8X8=y
CONFIG_VL53L5CX_DATA_READY_TIMEOUT_MS=200
CONFIG_BMP388=y
